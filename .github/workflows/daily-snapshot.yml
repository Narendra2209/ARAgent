name: Daily AR snapshot

# Captures one AR-aging snapshot per day by pinging the backend's capture
# endpoint. The ping also wakes the free-tier server from sleep, so this works
# even on days nobody opens the app. Runs on GitHub's schedule (free).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SNAPSHOT_URL = https://<your-render-service>.onrender.com/api/cron/snapshot
#   CRON_SECRET  = the same value set as CRON_SECRET in the Render environment
#
# You can also trigger it by hand from the Actions tab (workflow_dispatch).

on:
  schedule:
    # 20:00 UTC daily ≈ 06:00–07:00 in Sydney (AEST/AEDT), i.e. start of the
    # business day, so the snapshot is dated the current AU date. Adjust freely
    # (cron is in UTC). GitHub's scheduler can lag a few minutes under load.
    - cron: '0 20 * * *'
  workflow_dispatch: {}

# Never run two captures at once (e.g. a manual run overlapping the schedule).
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Ping snapshot endpoint
        env:
          SNAPSHOT_URL: ${{ secrets.SNAPSHOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SNAPSHOT_URL" ]; then
            echo "::error::SNAPSHOT_URL repo secret is not set."
            exit 1
          fi
          # --retry rides out the free-tier cold start: the first request may 502
          # while the server wakes, so retry on any error with a growing backoff.
          curl -fsS \
            --retry 8 --retry-delay 15 --retry-all-errors \
            --max-time 180 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SNAPSHOT_URL" | tee response.json
          echo
          echo "Snapshot response saved above."
